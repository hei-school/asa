name: POJA Import CI

on:
  push:
    branches:
      - import-09d37d5a-89d3-4f85-9e3e-04123acf69a2-post-transformation
env:
  ORG_ID: 67963e32-e54f-4785-93e8-4b4c8d56eced
  IMPORT_ID: 09d37d5a-89d3-4f85-9e3e-04123acf69a2

jobs:
  post-transformation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOW_REMAINING_DAYS_THRESHOLD: ${{ secrets.TEST_LOW_REMAINING_DAYS_THRESHOLD }}
      MAX_LATENESS_REPORT: ${{ secrets.TEST_MAX_LATENESS_REPORT }}
      ACCOUNTANTS: ${{ secrets.TEST_ACCOUNTANTS }}
      SENSITIVE_WORKERS_CODES: ${{ secrets.TEST_SENSITIVE_WORKERS_CODES }}

    steps:
      - uses: actions/checkout@v4.1.6

      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Zip test report
        if: always()
        run: cd build/reports/tests/test && zip -r $GITHUB_WORKSPACE/POST_TRANSFORMATION_TEST_REPORT.zip .

      - name: Upload test report
        if: always()
        run: |
          curl --fail -X POST "https://2egip6ihacjr6auyxa3gtmn4tu0pgaaj.lambda-url.eu-west-3.on.aws/orgs/${{ env.ORG_ID }}/imports/${{ env.IMPORT_ID }}/test-reports/POST_TRANSFORMATION_TEST_REPORT" \
            -H "Authorization: AppImportBearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @POST_TRANSFORMATION_TEST_REPORT.zip

  update-import-state:
    runs-on: ubuntu-latest
    needs: post-transformation-test
    if: always()

    steps:
      - name: Update import state
        run: |
          REPO_NAME=$(basename "${GITHUB_REPOSITORY}")

          if [ "${{ needs.post-transformation-test.result }}" == "success" ]; then
            JOB_STATUS="SUCCESS"
          else
            JOB_STATUS="FAILURE"
          fi

          curl --fail -X POST "https://2egip6ihacjr6auyxa3gtmn4tu0pgaaj.lambda-url.eu-west-3.on.aws/orgs/${{ env.ORG_ID }}/imports/${{ env.IMPORT_ID }}/states" \
            -H "Authorization: AppImportBearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --arg job_name "POST_TRANSFORMATION_TEST" \
                  --arg job_status "$JOB_STATUS" \
                  --arg run_id "${{ github.run_id }}" \
                  --arg attempt_nb "${{ github.run_attempt }}" \
                  --arg repo_owner "${{ github.repository_owner }}" \
                  --arg repo_name "$REPO_NAME" \
                  '{ job_name: $job_name, job_status: $job_status, run_id: $run_id, attempt_nb: $attempt_nb, repo_owner: $repo_owner, repo_name: $repo_name }')"